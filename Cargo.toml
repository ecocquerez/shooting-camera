[package]
name = "shooting-camera"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
image = "0.25.10"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-avfoundation"] }

[build-dependencies]
slint-build = "1.17.1"

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1
debug = false
