name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: shooting-camera

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_extension: zip
            target_binary: target/release/shooting-camera.exe
            platform_name: windows-x86_64
          - os: ubuntu-latest
            archive_extension: tar.gz
            target_binary: target/release/shooting-camera
            platform_name: linux-x86_64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        uses: ./.github/actions/read-cargo-version

      - name: Build artifact name
        shell: pwsh
        run: |
          "ARTIFACT_NAME=${{ env.BINARY_NAME }}-${{ env.PACKAGE_VERSION }}-${{ matrix.platform_name }}.${{ matrix.archive_extension }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify release tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $normalizedTag = $tag
          if ($normalizedTag.StartsWith('v')) {
            $normalizedTag = $normalizedTag.Substring(1)
          }
          if ($normalizedTag -ne "${{ env.PACKAGE_VERSION }}") {
            throw "Release tag '$tag' does not match Cargo.toml version '${{ env.PACKAGE_VERSION }}'"
          }

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.target_binary }}" -DestinationPath "${{ env.ARTIFACT_NAME }}"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ env.ARTIFACT_NAME }}" -C target/release "${{ env.BINARY_NAME }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_NAME }}
