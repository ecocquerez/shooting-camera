name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: shooting-camera

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_extension: zip
            target_binary: target/release/shooting-camera.exe
            platform_name: windows-x86_64
          - os: ubuntu-latest
            archive_extension: tar.gz
            target_binary: target/release/shooting-camera
            platform_name: linux-x86_64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Read version from Cargo.toml
      shell: pwsh
      run: |
        $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
        if (-not $versionLine) {
          throw 'Unable to find version in Cargo.toml'
        }
        $version = $versionLine.Matches[0].Groups[1].Value
        "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ARTIFACT_NAME=${{ env.BINARY_NAME }}-$version-${{ matrix.platform_name }}.${{ matrix.archive_extension }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify release tag matches Cargo.toml version
      shell: pwsh
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        $normalizedTag = $tag
        if ($normalizedTag.StartsWith('v')) {
          $normalizedTag = $normalizedTag.Substring(1)
        }
        if ($normalizedTag -ne "${{ env.PACKAGE_VERSION }}") {
          throw "Release tag '$tag' does not match Cargo.toml version '${{ env.PACKAGE_VERSION }}'"
        }

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          clang \
          libclang-dev \
          libfontconfig1-dev \
          libx11-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libgl1-mesa-dev

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Package Windows artifact
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path "${{ matrix.target_binary }}" -DestinationPath "${{ env.ARTIFACT_NAME }}"

    - name: Package Linux artifact
      if: runner.os == 'Linux'
      run: |
        tar -czf "${{ env.ARTIFACT_NAME }}" -C target/release "${{ env.BINARY_NAME }}"

    - name: Upload release asset
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARTIFACT_NAME }}
