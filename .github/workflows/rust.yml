name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          clang \
          libclang-dev \
          libfontconfig1-dev \
          libx11-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libgl1-mesa-dev

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
