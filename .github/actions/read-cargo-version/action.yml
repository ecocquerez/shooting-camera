name: Read Cargo package version
description: >-
  Read the Rust package version from Cargo.toml and expose it via GITHUB_ENV
runs:
  using: composite
  steps:
    - name: Read version from Cargo.toml
      shell: pwsh
      run: |
        $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
        if (-not $versionLine) {
          throw 'Unable to find version in Cargo.toml'
        }
        $version = $versionLine.Matches[0].Groups[1].Value
        "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
