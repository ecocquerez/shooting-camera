name: Install Linux build dependencies
description: >-
  Install Ubuntu packages required to build and test shooting-camera on Linux
runs:
  using: composite
  steps:
    - name: Install Ubuntu packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          clang \
          libclang-dev \
          libfontconfig1-dev \
          libx11-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libgl1-mesa-dev
